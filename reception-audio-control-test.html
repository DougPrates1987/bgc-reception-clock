<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#003058">
<title>BGC | Reception Audio Control</title>
<style>
:root{--navy:#003058;--navy-2:#001f3a;--teal:#1ebdb8;--teal-dark:#0b8582;--ink:#17324a;--muted:#6d8192;--line:#dce5eb;--canvas:#f4f7f9;--white:#fff;--success:#217b56;--success-bg:#eaf6ef;--shadow:0 16px 44px rgba(0,38,68,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px Calibri,Arial,sans-serif}.topbar{height:74px;background:var(--navy);color:var(--white);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,72px);box-shadow:0 4px 14px rgba(0,30,54,.13)}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border:2px solid var(--teal);border-radius:50%;display:grid;place-items:center;color:var(--teal);font-weight:700;letter-spacing:-1px;font-size:15px}.brand-name{font-weight:700;font-size:16px;letter-spacing:1.7px}.brand-sub{display:block;margin-top:2px;color:#bdd2df;font-size:10px;letter-spacing:1.1px;text-transform:uppercase}.top-status{display:flex;align-items:center;gap:9px;font-size:12px;color:#e7f4f6}.dot{width:8px;height:8px;border-radius:50%;background:#62d6a1;box-shadow:0 0 0 4px #62d6a11c}.page{max-width:1180px;margin:38px auto;padding:0 24px 38px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--teal-dark);text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:9px 0 25px}.heading h1{margin:0;color:var(--navy);font-size:32px;letter-spacing:-.3px}.heading p{margin:7px 0 0;color:var(--muted);font-size:15px}.demo-tag{white-space:nowrap;border:1px solid #d6e6e8;background:#eef9f8;color:#087c78;padding:8px 12px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:20px;align-items:start}.card{background:var(--white);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.now-card{padding:24px;overflow:hidden;position:relative}.now-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal)}.card-title{display:flex;justify-content:space-between;align-items:center;gap:15px}.card-title h2{margin:0;color:var(--navy);font-size:17px}.auto{display:flex;align-items:center;gap:7px;color:var(--success);font-size:11px;font-weight:700;letter-spacing:.7px}.auto i{width:7px;height:7px;background:#55be88;border-radius:50%}.playing{margin-top:23px;background:linear-gradient(135deg,#003058,#06466b);border-radius:7px;color:white;padding:21px;display:flex;align-items:center;gap:17px}.album{width:72px;height:72px;flex:0 0 72px;border-radius:5px;background:linear-gradient(145deg,#1ebdb8,#0c637d);display:grid;place-items:center;font-weight:700;color:white;box-shadow:inset 0 0 0 1px #ffffff38}.album span{font-size:22px;letter-spacing:-1px}.playing-info{min-width:0;flex:1}.playing-info small{font-size:10px;letter-spacing:1.4px;color:#94e5e0;text-transform:uppercase}.playing-info h3{font-size:21px;margin:6px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playing-info p{margin:0;color:#d1e0e9;font-size:12px}.playing-bars{height:22px;display:flex;align-items:center;gap:3px}.playing-bars b{display:block;width:3px;border-radius:2px;background:#69ddd4;animation:wave .75s ease-in-out infinite alternate}.playing-bars b:nth-child(2n){animation-delay:.25s}.playing-bars b:nth-child(3n){animation-delay:.45s}@keyframes wave{from{height:5px}to{height:20px}}.controls{display:flex;align-items:center;justify-content:center;gap:17px;margin:19px 0 15px}.control{border:0;background:transparent;color:var(--navy);font-size:17px;cursor:pointer;width:39px;height:39px;border-radius:50%}.control:hover{background:#eef4f7}.control.main{background:var(--teal);color:#003c50;width:46px;height:46px;font-size:18px;box-shadow:0 5px 12px #1ebdb83c}.control.main:hover{background:#42cec7}.volume{display:flex;align-items:center;gap:11px;max-width:270px;margin:0 auto;color:#5f788b;font-size:12px}.volume input{accent-color:var(--teal);flex:1;height:4px}.volume-value{min-width:32px;text-align:right}.auto-note{margin-top:21px;border-top:1px solid #e9eef1;padding-top:15px;display:flex;gap:10px;align-items:flex-start;color:#657b8d;font-size:12px;line-height:1.5}.auto-note strong{color:var(--navy)}.note-icon{width:22px;height:22px;border-radius:50%;background:#e8f7f6;color:#05827e;display:grid;place-items:center;flex:0 0 22px;font-weight:700}.queue-card{padding:22px 21px}.queue-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.queue-head h2{margin:0;color:var(--navy);font-size:17px}.queue-count{color:var(--muted);font-size:12px;margin-left:5px;font-weight:400}.add-btn{border:1px solid var(--teal);background:#effbfa;color:#087c78;padding:8px 11px;border-radius:4px;font:700 12px Calibri,Arial,sans-serif;cursor:pointer}.add-btn:hover{background:#dcf6f4}.track-list{list-style:none;margin:0;padding:0}.track{display:grid;grid-template-columns:36px minmax(0,1fr) auto 32px;align-items:center;gap:10px;min-height:57px;border-top:1px solid #edf1f3;padding:8px 2px}.track-no{width:29px;height:29px;display:grid;place-items:center;color:#60798c;background:#f1f5f7;border-radius:4px;font-size:11px;font-weight:700}.track.current .track-no{background:var(--teal);color:var(--navy)}.track-info{min-width:0}.track-info strong{display:block;color:#17354d;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-info small{display:block;margin-top:3px;color:#8193a0;font-size:11px}.badge{border-radius:3px;background:#edf4f7;color:#627b8d;font-size:9px;font-weight:700;letter-spacing:.55px;padding:5px 7px;text-transform:uppercase;white-space:nowrap}.current .badge{background:var(--success-bg);color:var(--success)}.row-play{border:0;background:transparent;color:#668094;font-size:13px;width:30px;height:30px;border-radius:50%;cursor:pointer}.row-play:hover{color:#087c78;background:#eaf8f7}.queue-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf1f3;padding-top:13px;margin-top:4px;color:#7b8e9b;font-size:11px}.toggle-row{display:flex;align-items:center;gap:9px;color:#446277;font-size:12px}.switch{position:relative;width:34px;height:19px;border:0;border-radius:12px;background:#b6c5cf;padding:0;cursor:pointer}.switch:after{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .18s}.switch.on{background:var(--teal-dark)}.switch.on:after{transform:translateX(15px)}.foot{margin-top:18px;color:#8293a0;font-size:11px;text-align:center}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#003058;color:#fff;padding:11px 16px;border-radius:5px;box-shadow:var(--shadow);font-size:13px;transition:.2s;max-width:calc(100vw - 32px)}.toast.show{opacity:1;transform:translate(-50%,0)}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:820px){.layout{grid-template-columns:1fr}.page{margin-top:26px}.queue-card{order:2}}@media(max-width:560px){.topbar{height:64px;padding:0 17px}.top-status{font-size:10px}.page{padding:0 14px 26px}.heading{align-items:flex-start;flex-direction:column;margin-bottom:17px}.heading h1{font-size:27px}.demo-tag{align-self:flex-start}.now-card,.queue-card{padding:18px}.playing{padding:15px;gap:12px}.album{width:58px;height:58px;flex-basis:58px}.playing-info h3{font-size:18px}.playing-bars{display:none}.track{grid-template-columns:32px minmax(0,1fr) auto 28px;gap:7px}.track-info strong{font-size:12px}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="portal-standard">
:root{--navy:#003058;--navy-2:#001e38;--teal:#1ebdb8;--teal-dark:#0e9490;--soft:#e3f6f4;--paper:#f6f4ee;--panel:#fdfcf9;--ink:#1c2430;--muted:#6b7280;--line:#e3e0d6;--white:#fff;--success:#3e735f;--success-bg:#f2faf7;--shadow:0 16px 42px #0030580b;--serif:'Playfair Display',Georgia,serif;--sans:'Poppins',Arial,sans-serif}
body{background:var(--paper);color:var(--ink);font:13px var(--sans)}
.topbar{position:relative;z-index:2;width:100%;min-height:76px;height:auto;padding:14px 30px;background:linear-gradient(120deg,#003058 0%,#001e38 100%);box-shadow:0 2px 14px rgba(0,24,46,.25)}
.brand{gap:15px;color:#fff}.brand-logo{display:block;width:56px;height:56px;object-fit:contain}.brand-name{font:600 26px/1.15 var(--serif);color:#fff;letter-spacing:0}.brand-sub{margin-top:5px;color:#c9d8e3;font:400 12px/1.35 var(--sans);letter-spacing:0;text-transform:none}
.topbar-actions{display:flex;align-items:center;gap:12px}.account-btn{border:1px solid #ffffff3d;border-radius:3px;padding:7px 11px;background:#ffffff0d;color:#fff;font:500 10px var(--sans);cursor:pointer}
.demo-tag{border:1px solid #ffffff3d;border-radius:3px;padding:7px 10px;background:#ffffff0d;color:#d6e9ee;font:600 9px var(--sans);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.light-tag{border-color:#cfe7e5;background:var(--soft);color:#0e7976}
.workspace-app{display:block;min-height:calc(100vh - 76px)}.project-bar{height:54px;padding:0 16px;background:#001e38;display:flex;align-items:center;justify-content:space-between;color:#fff}.back-btn{border:1px solid #ffffff3d;border-radius:3px;padding:7px 11px;background:#ffffff0d;color:#fff;font:500 10px var(--sans);cursor:pointer}.project-name{font:400 11px var(--sans);color:#c9d8e3}.notification-btn{width:32px;height:30px;border:1px solid #ffffff3d;border-radius:3px;background:#ffffff0d;color:#fff;font-size:15px;cursor:pointer}
.workspace-nav{padding:24px 14px;background:#fff;border-right:1px solid #dce4e8}
.workspace-nav button{width:100%;height:38px;margin:3px 0;padding:10px 12px;border:0;border-radius:3px;background:none;color:#405d73;text-align:left;font:400 11px var(--sans);cursor:pointer}
.workspace-nav button[aria-pressed=true]{background:#edf3f5;box-shadow:inset 3px 0 var(--teal);color:var(--navy)}
.page{max-width:1200px;width:100%;min-width:0;margin:0 auto;padding:28px clamp(20px,3vw,42px) 38px}
.eyebrow{display:block;color:var(--teal-dark);font:700 9px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.heading{margin:7px 0 25px}.heading h1{color:var(--navy);font:600 32px/1.2 var(--serif);letter-spacing:0}.heading p{color:#6b7280;font:400 12px/1.55 var(--sans)}
.card{background:var(--panel);border-color:var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-title h2,.queue-head h2{font-family:var(--serif);font-weight:600;color:var(--navy)}
@media(max-width:760px){.topbar{padding:12px 16px}.project-bar{height:46px}}
@media(max-width:560px){.topbar{min-height:62px;padding:10px}.brand{gap:8px}.brand-logo{width:42px;height:42px}.brand-name{font-size:19px}.brand-sub{font-size:9px}.topbar-actions{gap:6px}.demo-tag{padding:6px 7px;font-size:8px}.account-btn{padding:6px 8px;font-size:9px}.page{padding:22px 14px 26px}}
</style>

<style id="reception-header-style">
.reception-app-header{width:100%;color:#fff}
.script-appbar{height:38px;padding:0 13px;background:#001e38;display:flex;align-items:center;justify-content:space-between;color:#c9d8e3;font:400 10px var(--sans)}
.close-btn{border:1px solid #ffffff3d;border-radius:3px;padding:6px 10px;background:#ffffff0d;color:#fff;font:500 10px var(--sans);cursor:pointer}
.close-btn:hover{background:#ffffff18}
.titlebar{min-height:75px;padding:13px 28px 14px;background:linear-gradient(120deg,#003058 0%,#001e38 100%);box-shadow:0 2px 14px rgba(0,24,46,.2)}
.titlebar h1{margin:0;color:#fff;font:600 26px/1.15 var(--serif);letter-spacing:0}
.titlebar p{margin:3px 0 0;color:#c9d8e3;font:400 11px/1.35 var(--sans)}
@media(max-width:560px){.script-appbar{height:36px;padding:0 12px}.titlebar{min-height:69px;padding:12px 16px}.titlebar h1{font-size:22px}.titlebar p{font-size:10px}}
</style>
</head>
<body>

<div class="reception-app-header">
  <div class="script-appbar"><button class="close-btn" type="button">Close</button><span>Reception Audio Control</span></div>
  <div class="titlebar"><h1>Reception Audio Control</h1><p>Instrumental Hymns for the Reception Area</p></div>
</div>
<div class="workspace-app"><main class="page">
  <div class="layout">
    <section class="card now-card" aria-label="Playback controls">
      <div class="card-title"><h2>Now Playing</h2><span class="auto"><i></i> AUTOPLAY ON</span></div>
      <div class="playing"><div class="album"><span>CCB</span></div><div class="playing-info"><small>NOW PLAYING</small><h3 id="nowTitle">CCB Hymn 02</h3><p>Instrumental · Orchestra</p></div><div class="playing-bars" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div></div>
      <div class="controls"><button class="control" id="prev" title="Previous hymn" aria-label="Previous hymn">|◀</button><button class="control main" id="play" title="Pause" aria-label="Pause">Ⅱ</button><button class="control" id="next" title="Next hymn" aria-label="Next hymn">▶|</button></div>
      <label class="volume"><span aria-hidden="true">♪</span><span class="visually-hidden">Volume</span><input id="volume" type="range" min="0" max="100" value="72"><span class="volume-value" id="volumeValue">72%</span></label>
      <div class="auto-note"><span class="note-icon">✓</span><span><strong>Autoplay enabled.</strong> The TV advances to the next hymn when a track ends.</span></div>
    </section>
    <section class="card queue-card" aria-label="Hymn playlist">
      <div class="queue-head"><h2>Hymn Library <span class="queue-count" id="count">5 tracks</span></h2><button class="add-btn" id="add">＋ Add hymn</button><input class="visually-hidden" id="file" type="file" accept="audio/mpeg,audio/mp3,.mp3" multiple></div>
      <ul class="track-list" id="tracks"></ul>
      <div class="queue-foot"><span>CCB · Instrumental</span><label class="toggle-row"><span>Autoplay on start</span><button class="switch on" id="auto" type="button" role="switch" aria-checked="true" aria-label="Autoplay"></button></label></div>
    </section>
  </div>
  
</main></div><audio id="hymnPlayer" preload="metadata" playsinline></audio><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
 const base='https://github.com/DougPrates1987/bgc-reception-clock/releases/download/v1.0.0-test/';
 const songs=[
  {name:'CCB Hymn 01',detail:'Instrumental · Orchestra',src:base+'ccb-hino-01.mp3'},
  {name:'CCB Hymn 02',detail:'Instrumental · Orchestra',src:base+'ccb-hino-02.mp3'},
  {name:'CCB Hymn 03',detail:'Instrumental · Orchestra',src:base+'ccb-hino-03.mp3'},
  {name:'CCB Hymn 04',detail:'Instrumental · Orchestra',src:base+'ccb-hino-04.mp3'}
 ];
 const player=document.getElementById('hymnPlayer');
 const list=document.getElementById('tracks');
 const toast=document.getElementById('toast');
 const playButton=document.getElementById('play');
 let current=0,playing=false,auto=true,failures=0,retryScheduled=false,retryTimer=0;
 function shuffle(){for(let i=songs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[songs[i],songs[j]]=[songs[j],songs[i]]}}
 shuffle();
 function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove('show'),2600)}
 function render(){
  list.replaceChildren();
  songs.forEach((song,index)=>{
   const row=document.createElement('li');
   row.className='track'+(index===current?' current':'');
   row.innerHTML=`<span class="track-no">${String(index+1).padStart(2,'0')}</span><span class="track-info"><strong></strong><small></small></span><span class="badge">${index===current?(playing?'Playing':'Selected'):(song.detail.startsWith('Added file')?'New':'In Queue')}</span><button class="row-play" type="button" aria-label="Play track">▶</button>`;
   row.querySelector('strong').textContent=song.name;
   row.querySelector('small').textContent=song.detail;
   row.querySelector('.row-play').addEventListener('click',()=>select(index,true));
   list.append(row);
  });
  document.getElementById('count').textContent=`${songs.length} tracks`;
  document.getElementById('nowTitle').textContent=songs[current]?.name||'No hymn selected';
  playButton.textContent=playing?'Ⅱ':'▶';
  playButton.title=playing?'Pause':'Play';
  playButton.setAttribute('aria-label',playing?'Pause':'Play');
  const autoButton=document.getElementById('auto');
  autoButton.classList.toggle('on',auto);
  autoButton.setAttribute('aria-checked',String(auto));
  document.querySelector('.auto').innerHTML=`<i></i> ${auto?'AUTOPLAY ON':'AUTOPLAY OFF'}`;
 }
 function startPlayback(){
  const result=player.play();
  if(result&&typeof result.catch==='function') result.catch(error=>{
   if(error&&error.name==='NotAllowedError'){playing=false;render();notify('Press Play once to allow music on this TV.')}
   else scheduleFailure();
  });
 }
 function scheduleFailure(){
  if(retryScheduled)return;
  if(failures<3){
   failures++;retryScheduled=true;
   notify(`Connection interrupted. Retrying hymn (${failures}/3)…`);
   retryTimer=setTimeout(()=>{retryScheduled=false;player.src=songs[current].src;player.load();startPlayback()},Math.min(12000,1500*Math.pow(2,failures-1)));
  }else{
   failures=0;retryScheduled=false;
   if(auto){notify('This hymn could not be loaded. Moving to the next hymn.');advance()}
   else{playing=false;render();notify('This hymn could not be loaded. Select another track or press Play to retry.')}
  }
 }
 function loadAndPlay(index){
  clearTimeout(retryTimer);retryScheduled=false;failures=0;
  current=(index+songs.length)%songs.length;
  const song=songs[current];
  if(!song)return;
  playing=true;
  player.src=song.src;
  player.load();
  render();
  startPlayback();
 }
 function advance(){
  if(!songs.length)return;
  const previous=songs[current]?.src;
  if(current>=songs.length-1){
   shuffle();
   if(songs.length>1&&songs[0].src===previous)[songs[0],songs[1]]=[songs[1],songs[0]];
   loadAndPlay(0);
  }else loadAndPlay(current+1);
 }
 function select(index,shouldPlay){
  if(!songs.length)return;
  if(shouldPlay)loadAndPlay(index);
  else{current=(index+songs.length)%songs.length;render()}
  notify(`Selected: ${songs[current].name}`);
 }
 document.getElementById('prev').onclick=()=>{
  if(player.currentTime>3){player.currentTime=0;player.play().catch(()=>notify('Press Play to resume the hymn.'));return}
  select(current-1,true);
 };
 document.getElementById('next').onclick=()=>advance();
 playButton.onclick=()=>{
  if(player.paused){if(!player.src)loadAndPlay(current);else startPlayback()}
  else player.pause();
 };
 player.addEventListener('play',()=>{playing=true;render()});
 player.addEventListener('playing',()=>{failures=0;retryScheduled=false;clearTimeout(retryTimer)});
 player.addEventListener('pause',()=>{if(!player.ended){playing=false;render()}});
 player.addEventListener('ended',()=>{if(auto)advance();else{playing=false;render();notify('Track finished. Autoplay is off.')}});
 player.addEventListener('error',scheduleFailure);
 const volume=document.getElementById('volume');
 player.volume=Number(volume.value)/100;
 volume.oninput=()=>{document.getElementById('volumeValue').textContent=volume.value+'%';player.volume=Number(volume.value)/100};
 volume.onchange=()=>notify(`Volume set to ${volume.value}%`);
 document.getElementById('auto').onclick=()=>{auto=!auto;render();notify(auto?'Autoplay enabled':'Autoplay disabled')};
 document.getElementById('add').onclick=()=>document.getElementById('file').click();
 document.getElementById('file').onchange=event=>{
  const files=[...event.target.files].filter(file=>file.name.toLowerCase().endsWith('.mp3'));
  for(const file of files)songs.push({name:file.name.replace(/\.mp3$/i,''),detail:'Added file · local MP3',src:URL.createObjectURL(file)});
  render();
  if(files.length)notify(`${files.length} track(s) added for this session`);
  event.target.value='';
 };
 render();
 player.src=songs[current].src;
 player.load();
 if(auto)startPlayback();
})();
</script>
</body>
</html>
